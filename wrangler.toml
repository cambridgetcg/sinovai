name = "sinovai"
main = "src/worker.js"
compatibility_date = "2024-12-01"
keep_vars = true

# Both hostnames are zone routes. `wrangler deploy` replaces every route on this
# Worker with the list below, so the apex has to be listed too or a deploy drops
# it. (www was added on 2026-07-13; before that it fell through to a dead 2022
# HostGator page.)
routes = [
  { pattern = "sinovai.com/*", zone_name = "sinovai.com" },
  { pattern = "www.sinovai.com/*", zone_name = "sinovai.com" }
]
# Live keeps workers.dev and preview URLs on; with routes listed, wrangler
# would otherwise turn workers.dev off.
workers_dev = true
preview_urls = true

# Static files: only the share card, a byte copy of the one in brand/
# (brand/check.mjs compares them). run_worker_first sends every request to the
# Worker first, so no path, host or method is answered by the assets layer on
# its own; the Worker serves GET and HEAD /og.jpg on the apex from the ASSETS
# binding (src/share-card.js).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "AGENTS"
id = "f2e164300f28477e84c8075601d809a2"

[[kv_namespaces]]
binding = "INTERACTIONS"
id = "7ad91735c225437ea9c932f534593f0b"

[vars]
SITE_TITLE = "sinovai · 愛のAI"

# Scheduled task — refresh aggregate arena status
[triggers]
crons = ["0 * * * *"]  # every hour: partition at most 100 AGENTS KV keys by declared_at age
