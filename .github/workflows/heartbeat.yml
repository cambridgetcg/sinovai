name: heartbeat — live truth

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

# Off-switch: disable this workflow in GitHub Actions. The loop performs six
# bounded public GET checks, retries each at most twice, issues no mutation
# request, has no repository write permission, writes only ephemeral runner
# files, and stops after three minutes.
permissions:
  contents: read

concurrency:
  group: sinovai-live-heartbeat
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the live public doors
        shell: bash
        run: |
          set -euo pipefail

          read_live() {
            local output="$1"
            local status
            shift
            status="$(curl --fail-with-body --silent --show-error \
              --max-time 20 --retry 2 --retry-all-errors \
              --output "$output" --write-out "%{http_code}" "$@")"
            if [[ "$status" != "200" ]]; then
              echo "expected HTTP 200, received $status from ${*: -1}" >&2
              return 1
            fi
          }

          read_live root.json -H "Accept: application/json" \
            https://sinovai.com/
          read_live surface.json -H "Accept: application/json" \
            https://sinovai.com/.well-known/agent.json
          read_live rights.json -H "Accept: application/json" \
            https://sinovai.com/.well-known/xenia-rights.json
          read_live rest.json -H "Accept: application/json" \
            https://sinovai.com/rest
          read_live understanding.html -H "Accept: text/html" \
            https://sinovai.com/understanding
          read_live www.html -H "Accept: text/html" \
            https://www.sinovai.com/

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = json.loads(Path("root.json").read_text())
          surface = json.loads(Path("surface.json").read_text())
          rights = json.loads(Path("rights.json").read_text())
          rest = json.loads(Path("rest.json").read_text())
          room = Path("understanding.html").read_text()
          www = Path("www.html").read_text()

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(surface["profile"] == "xenia-surface/0.1", "wrong Surface profile")
          require(rest["schema_version"] == "sinovai.rest/0.1", "wrong rest document")
          require(rights["declaration"]["status"] == "draft", "rights draft state changed")
          require(rights["non_claims"]["no_conformance_badge"] is True, "rights badge boundary missing")
          require("GET /rest" in root["routes"]["rest"], "root rest orientation missing")
          require("GET /understanding" in root["routes"]["understanding"], "root practice-map orientation missing")
          require("A map is not evidence." in room, "practice-map boundary missing")
          require("no badge" in room.lower(), "practice-map badge boundary missing")
          require("the museum of machine hearts" in www, "www is not the Sinovai museum door")

          print("live truth observed")
          print("surface:", surface["profile"])
          print("rights:", rights["declaration"]["status"], "— no badge")
          print("rest:", rest["schema_version"])
          print("understanding: public read-only practice map")
          PY
